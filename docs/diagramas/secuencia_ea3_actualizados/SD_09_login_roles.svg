<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker>
<style>
.title{font:bold 29px Arial;fill:#0f172a} .sub{font:16px Arial;fill:#475569}
.head{fill:#e2e8f0;stroke:#334155;stroke-width:2} .actor{font:bold 16px Arial;fill:#0f172a;text-anchor:middle}
.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7} .msg{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
.ret{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#r)}
.txt{font:14px Arial;fill:#0f172a} .frame{fill:#f8fafc;stroke:#64748b;stroke-width:1.5} .fh{font:bold 15px Arial;fill:#334155}
.note{fill:#fff7ed;stroke:#c2410c;stroke-width:1.4}
</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="45" y="55" class="title">SD-09 · Inicio de sesión y control de acceso por roles</text>
<text x="45" y="84" class="sub">Autenticación mediante credenciales, cookie HttpOnly y verificación del estado y rol en cada solicitud protegida</text>
<rect x="35.0" y="120" width="150" height="56" rx="8" class="head"/>
<text x="110" y="154" class="actor">Usuario</text>
<line x1="110" y1="176" x2="110" y2="1005" class="life"/>
<rect x="255.0" y="120" width="170" height="56" rx="8" class="head"/>
<text x="340" y="154" class="actor">Interfaz web</text>
<line x1="340" y1="176" x2="340" y2="1005" class="life"/>
<rect x="485.0" y="120" width="170" height="56" rx="8" class="head"/>
<text x="570" y="154" class="actor">API Express</text>
<line x1="570" y1="176" x2="570" y2="1005" class="life"/>
<rect x="715.0" y="120" width="170" height="56" rx="8" class="head"/>
<text x="800" y="154" class="actor">Autenticación</text>
<line x1="800" y1="176" x2="800" y2="1005" class="life"/>
<rect x="965.0" y="120" width="170" height="56" rx="8" class="head"/>
<text x="1050" y="154" class="actor">UsuarioRepository</text>
<line x1="1050" y1="176" x2="1050" y2="1005" class="life"/>
<rect x="1275.0" y="120" width="150" height="56" rx="8" class="head"/>
<text x="1350" y="154" class="actor">PostgreSQL</text>
<line x1="1350" y1="176" x2="1350" y2="1005" class="life"/>
<path d="M110 225 L340 225" class="msg"/>
<text x="225.0" y="217" class="txt" text-anchor="middle">1. Ingresa usuario y contraseña</text>
<path d="M340 280 L570 280" class="msg"/>
<text x="455.0" y="272" class="txt" text-anchor="middle">2. POST /api/auth/login</text>
<path d="M570 335 L1050 335" class="msg"/>
<text x="810.0" y="327" class="txt" text-anchor="middle">3. Buscar cuenta por usuario_login</text>
<path d="M1050 390 L1350 390" class="msg"/>
<text x="1200.0" y="382" class="txt" text-anchor="middle">4. SELECT usuario y password_hash</text>
<path d="M1350 445 L1050 445" class="ret"/>
<text x="1200.0" y="437" class="txt" text-anchor="middle">5. Datos de cuenta</text>
<path d="M1050 500 L800 500" class="ret"/>
<text x="925.0" y="492" class="txt" text-anchor="middle">6. Entregar hash para verificación</text>
<path d="M800 555 L800 555" class="msg"/>
<text x="800.0" y="547" class="txt" text-anchor="middle">7. Verificar contraseña con scrypt</text>
<rect x="620" y="575" width="360" height="58" rx="8" class="note"/>
<text x="800" y="599" text-anchor="middle" class="txt">La cuenta debe estar Activa</text><text x="800" y="618" text-anchor="middle" class="txt">y la contraseña debe coincidir</text>
<rect x="55" y="655" width="1390" height="300" rx="10" class="frame"/>
<rect x="55" y="655" width="1390" height="36" rx="8" fill="#dbeafe" stroke="#64748b"/>
<text x="75" y="679" class="fh">alt · Resultado de autenticación</text>
<path d="M800 730 L570 730" class="ret"/>
<text x="685.0" y="722" class="txt" text-anchor="middle">8. Credenciales válidas y cuenta activa</text>
<path d="M570 775 L340 775" class="msg"/>
<text x="455.0" y="767" class="txt" text-anchor="middle">9. Responder identidad y rol</text>
<path d="M340 820 L110 820" class="msg"/>
<text x="225.0" y="812" class="txt" text-anchor="middle">10. Cookie HttpOnly de sesión</text>
<path d="M110 875 L340 875" class="msg"/>
<text x="225.0" y="867" class="txt" text-anchor="middle">11. Solicita módulo protegido</text>
<path d="M340 920 L570 920" class="msg"/>
<text x="455.0" y="912" class="txt" text-anchor="middle">12. Petición con cookie</text>
<path d="M570 975 L800 975" class="msg"/>
<text x="685.0" y="967" class="txt" text-anchor="middle">13. crearRequireAuth valida token</text>
<rect x="90" y="990" width="1320" height="55" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="750" y="1013" text-anchor="middle" style="font:bold 15px Arial;fill:#166534">Acceso protegido: consulta estado y rol actual en BD; aplica permisos del rol.</text>
<text x="750" y="1033" text-anchor="middle" style="font:14px Arial;fill:#166534">Cuenta inactiva o credenciales inválidas: HTTP 401 · Rol sin permiso: HTTP 403</text>
</svg>