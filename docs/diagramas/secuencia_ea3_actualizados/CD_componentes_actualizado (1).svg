<text x="1000" y="528" text-anchor="middle" class="bh">GestionCeldas</text>
<text x="1000" y="557" text-anchor="middle" class="tx">Registro, actualización y eliminación</text>
<rect x="835" y="625" width="330" height="85" class="business"/>
<text x="1000" y="658" text-anchor="middle" class="bh">Servicios de dominio</text>
<text x="1000" y="685" text-anchor="middle" class="tx">ValidadorMensualidad · AsignadorCelda</text>

<!-- Data -->
<rect x="1250" y="190" width="285" height="110" class="data"/>
<text x="1392" y="222" text-anchor="middle" class="bh">UsuarioRepository</text>
<text x="1392" y="250" text-anchor="middle" class="tx">Consulta estado y rol vigente</text>
<text x="1392" y="275" text-anchor="middle" class="sm">Guarda login y hash de contraseña</text>
<rect x="1250" y="345" width="285" height="105" class="data"/>
<text x="1392" y="378" text-anchor="middle" class="bh">Otros repositorios</text>
<text x="1392" y="407" text-anchor="middle" class="tx">Vehículo · Celda · Mensualidad</text>
<text x="1392" y="430" text-anchor="middle" class="tx">Pago · Registro de acceso</text>
<rect x="1250" y="510" width="285" height="105" class="data"/>
<text x="1392" y="545" text-anchor="middle" class="bh">PostgreSQL</text>
<text x="1392" y="575" text-anchor="middle" class="tx">Persistencia de usuarios</text>
<text x="1392" y="598" text-anchor="middle" class="tx">y operaciones</text>

<!-- Edges -->
<path d="M285 245 H375" class="edge"/>
<text x="330" y="232" text-anchor="middle" class="sm">solicitudes</text>
<path d="M560 280 V305 H460 V325" class="edge"/>
<path d="M560 305 H660 V325" class="edge"/>
<path d="M545 390 H575" class="edge"/>
<path d="M460 450 V485 H460 V510" class="edge"/>
<path d="M660 480 V495 H660 V510" class="edge"/>
<path d="M745 230 H790 V245 H835" class="edge"/>
<path d="M745 555 H790 V245 H835" class="edge"/>
