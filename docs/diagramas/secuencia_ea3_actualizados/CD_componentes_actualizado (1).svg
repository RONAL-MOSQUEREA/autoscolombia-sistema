<text x="175" y="150" text-anchor="middle" class="head">Cliente web</text>
<text x="560" y="150" text-anchor="middle" class="head">Presentación y seguridad</text>
<text x="1000" y="150" text-anchor="middle" class="head">Lógica de negocio</text>
<text x="1392" y="150" text-anchor="middle" class="head">Acceso a datos</text>

<!-- UI -->
<rect x="65" y="195" width="220" height="105" class="node"/>
<text x="175" y="225" text-anchor="middle" class="bh">Interfaz web</text>
<text x="175" y="252" text-anchor="middle" class="tx">public/index.html</text>
<text x="175" y="275" text-anchor="middle" class="sm">Login y vistas según rol</text>
<rect x="65" y="345" width="220" height="135" class="node"/>
<text x="175" y="375" text-anchor="middle" class="bh">Vistas de la aplicación</text>
<text x="175" y="407" text-anchor="middle" class="tx">Administrador: módulos</text>
<text x="175" y="432" text-anchor="middle" class="tx">Operario: operaciones</text>
<text x="175" y="457" text-anchor="middle" class="tx">Cliente: Mi cuenta</text>
