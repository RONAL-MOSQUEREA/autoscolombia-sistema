<path d="M745 555 H790 V540 H835" class="edge"/>
<path d="M1165 245 H1250" class="edge"/>
<path d="M1165 397 H1205 V397 H1250" class="edge"/>
<path d="M1165 540 H1205 V397 H1250" class="edge"/>
<path d="M1392 300 V510" class="edge"/>
<path d="M1392 450 V510" class="edge"/>
<path d="M745 402 H790 V565 H1228 V565 H1250" class="dash"/>
<text x="1005" y="555" text-anchor="middle" class="sm">/mi-cuenta: consulta directa de cuenta, vehículos y última mensualidad</text>
<path d="M545 385 H560 V170 H560 V190" class="dash"/>

<!-- Role and security notes -->
<rect x="55" y="785" width="1490" height="275" class="panel"/>
<text x="800" y="825" text-anchor="middle" class="head">Autorización por roles implementada</text>
<rect x="85" y="855" width="445" height="105" class="node"/>
<text x="307" y="885" text-anchor="middle" class="bh">Administrador</text>
<text x="307" y="915" text-anchor="middle" class="tx">Usuarios, credenciales, vehículos, celdas,</text>
<text x="307" y="940" text-anchor="middle" class="tx">mensualidades, pagos y operaciones</text>
<rect x="577" y="855" width="445" height="105" class="node"/>
<text x="799" y="885" text-anchor="middle" class="bh">Operario</text>
<text x="799" y="915" text-anchor="middle" class="tx">Ingresos, salidas, dashboard, novedades</text>
<text x="799" y="940" text-anchor="middle" class="tx">y consulta de estado del vehículo</text>
<rect x="1069" y="855" width="445" height="105" class="node"/>
<text x="1291" y="885" text-anchor="middle" class="bh">Cliente</text>
<text x="1291" y="915" text-anchor="middle" class="tx">Mi cuenta: datos propios, vehículos</text>
<text x="1291" y="940" text-anchor="middle" class="tx">y última mensualidad / estado de pago</text>
<text x="800" y="1000" text-anchor="middle" class="tx">Cada solicitud protegida valida la sesión y consulta en la base de datos el estado y rol actuales del usuario.</text>
<text x="800" y="1028" text-anchor="middle" class="tx">Si la cuenta está inactiva: se invalida la sesión y se responde HTTP 401 CUENTA_INACTIVA.</text>
<text x="800" y="1048" text-anchor="middle" class="sm">El rol procede del servidor; no se confía en un rol enviado por el cliente. El hash nunca se devuelve.</text>
</svg>