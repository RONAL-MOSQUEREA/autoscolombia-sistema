<text x="660" y="570" text-anchor="middle" class="tx">Gestión de usuarios</text>
<rect x="475" y="650" width="170" height="65" class="node"/>
<text x="560" y="677" text-anchor="middle" class="bh">routes/errores.js</text>
<text x="560" y="699" text-anchor="middle" class="sm">Errores HTTP coherentes</text>

<!-- Business -->
<rect x="835" y="190" width="330" height="110" class="business"/>
<text x="1000" y="222" text-anchor="middle" class="bh">GestionUsuarios</text>
<text x="1000" y="250" text-anchor="middle" class="tx">Crear, actualizar e inactivar</text>
<text x="1000" y="275" text-anchor="middle" class="sm">Asignar login y hash scrypt</text>
<rect x="835" y="345" width="330" height="105" class="business"/>
<text x="1000" y="378" text-anchor="middle" class="bh">ControlOperaciones</text>
<text x="1000" y="407" text-anchor="middle" class="tx">Ingresos, salidas, mensualidades</text>
<text x="1000" y="430" text-anchor="middle" class="tx">y pagos</text>
