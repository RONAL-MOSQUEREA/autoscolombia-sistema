<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <style>
    .title{font: bold 30px Arial,sans-serif;fill:#0f172a}
    .sub{font:16px Arial,sans-serif;fill:#475569}
    .head{font:bold 20px Arial,sans-serif;fill:#1e3a8a}
    .bh{font:bold 17px Arial,sans-serif;fill:#0f172a}
    .tx{font:15px Arial,sans-serif;fill:#334155}
    .sm{font:13px Arial,sans-serif;fill:#475569}
    .panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:16}
    .node{fill:#fff;stroke:#64748b;stroke-width:1.7;rx:10}
    .security{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:10}
    .business{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.7;rx:10}
    .data{fill:#fff7ed;stroke:#ea580c;stroke-width:1.7;rx:10}
    .edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arr)}
    .dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arr)}
  </style>
</defs>
<rect width="1600" height="1120" fill="#ffffff"/>
<text x="800" y="48" text-anchor="middle" class="title">Diagrama de componentes — Autos Colombia EA3</text>
<text x="800" y="78" text-anchor="middle" class="sub">Autenticación, autorización por roles, gestión de credenciales y consulta de cuenta del Cliente</text>

<!-- Layer panels -->
<rect x="35" y="115" width="280" height="635" class="panel"/>
<rect x="340" y="115" width="440" height="635" class="panel"/>
<rect x="805" y="115" width="390" height="635" class="panel"/>
