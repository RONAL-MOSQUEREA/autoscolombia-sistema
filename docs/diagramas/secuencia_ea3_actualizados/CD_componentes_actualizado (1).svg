<!-- Presentation -->
<rect x="375" y="190" width="370" height="90" class="security"/>
<text x="560" y="222" text-anchor="middle" class="bh">Express — routes/api.js</text>
<text x="560" y="250" text-anchor="middle" class="tx">Rutas internas protegidas por sesión</text>
<rect x="375" y="325" width="170" height="125" class="security"/>
<text x="460" y="355" text-anchor="middle" class="bh">auth.js</text>
<text x="460" y="382" text-anchor="middle" class="tx">crearRequireAuth</text>
<text x="460" y="407" text-anchor="middle" class="sm">Valida sesión, estado</text>
<text x="460" y="428" text-anchor="middle" class="sm">y rol vigente</text>
<rect x="575" y="325" width="170" height="155" class="security"/>
<text x="660" y="355" text-anchor="middle" class="bh">authController</text>
<text x="660" y="382" text-anchor="middle" class="tx">Login / logout /me</text>
<text x="660" y="407" text-anchor="middle" class="tx">/mi-cuenta</text>
<text x="660" y="438" text-anchor="middle" class="sm">/mi-cuenta solo Cliente</text>
<text x="660" y="459" text-anchor="middle" class="sm">otros roles: HTTP 403</text>
