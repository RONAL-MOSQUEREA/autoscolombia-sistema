<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker>
<style>
.title{font:bold 29px Arial;fill:#0f172a} .sub{font:16px Arial;fill:#475569}
.head{fill:#e2e8f0;stroke:#334155;stroke-width:2} .actor{font:bold 15px Arial;fill:#0f172a;text-anchor:middle}
.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7} .msg{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
.ret{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#r)}
.txt{font:14px Arial;fill:#0f172a} .frame{fill:#f8fafc;stroke:#64748b;stroke-width:1.5} .fh{font:bold 15px Arial;fill:#334155}
</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="45" y="55" class="title">SD-07 · Registrar celda</text>
<text x="45" y="84" class="sub">Operación administrativa protegida por autenticación y autorización de rol</text>
<rect x="30.0" y="120" width="160" height="56" rx="8" class="head"/>
<text x="110" y="154" class="actor">Administrador</text>
<line x1="110" y1="176" x2="110" y2="990" class="life"/>
<rect x="250.0" y="120" width="180" height="56" rx="8" class="head"/>
<text x="340" y="154" class="actor">Interfaz web</text>
<line x1="340" y1="176" x2="340" y2="990" class="life"/>
<rect x="480.0" y="120" width="180" height="56" rx="8" class="head"/>
<text x="570" y="154" class="actor">API Express</text>
<line x1="570" y1="176" x2="570" y2="990" class="life"/>
<rect x="710.0" y="120" width="180" height="56" rx="8" class="head"/>
<text x="800" y="154" class="actor">Autenticación</text>
<line x1="800" y1="176" x2="800" y2="990" class="life"/>
<rect x="960.0" y="120" width="180" height="56" rx="8" class="head"/>
<text x="1050" y="154" class="actor">Gestión / Repositorio</text>
<line x1="1050" y1="176" x2="1050" y2="990" class="life"/>
<rect x="1270.0" y="120" width="160" height="56" rx="8" class="head"/>
<text x="1350" y="154" class="actor">PostgreSQL</text>
<line x1="1350" y1="176" x2="1350" y2="990" class="life"/>
<path d="M110 225 L340 225" class="msg"/>
<text x="225.0" y="217" class="txt" text-anchor="middle">1. Ingresa datos de la celda</text>
<path d="M340 280 L570 280" class="msg"/>
<text x="455.0" y="272" class="txt" text-anchor="middle">2. POST /api/celdas + cookie</text>
<path d="M570 335 L800 335" class="msg"/>
<text x="685.0" y="327" class="txt" text-anchor="middle">3. Validar sesión y token</text>
<path d="M800 390 L1350 390" class="msg"/>
<text x="1075.0" y="382" class="txt" text-anchor="middle">4. Consultar estado y rol actual</text>
<path d="M1350 445 L800 445" class="ret"/>
<text x="1075.0" y="437" class="txt" text-anchor="middle">5. Administrador activo</text>
<path d="M800 500 L570 500" class="ret"/>
<text x="685.0" y="492" class="txt" text-anchor="middle">6. Autorizar operación</text>
<path d="M570 555 L1050 555" class="msg"/>
<text x="810.0" y="547" class="txt" text-anchor="middle">7. registrarCelda(datos)</text>
<path d="M1050 610 L1050 610" class="msg"/>
<text x="1050.0" y="602" class="txt" text-anchor="middle">8. Validar campos y reglas de negocio</text>
<path d="M1050 665 L1350 665" class="msg"/>
<text x="1200.0" y="657" class="txt" text-anchor="middle">9. Consultar identificador / número de celda</text>
<path d="M1350 720 L1050 720" class="ret"/>
<text x="1200.0" y="712" class="txt" text-anchor="middle">10. Resultado de consulta</text>
<rect x="65" y="755" width="1370" height="185" rx="10" class="frame"/>
<rect x="65" y="755" width="1370" height="36" rx="8" fill="#dbeafe" stroke="#64748b"/>
<text x="85" y="779" class="fh">alt · Validación y persistencia</text>
<path d="M1050 835 L1350 835" class="msg"/>
<text x="1200.0" y="827" class="txt" text-anchor="middle">11. INSERT nueva celda</text>
<path d="M1350 880 L1050 880" class="ret"/>
<text x="1200.0" y="872" class="txt" text-anchor="middle">12. Celda registrada</text>
<path d="M1050 925 L570 925" class="ret"/>
<text x="810.0" y="917" class="txt" text-anchor="middle">13. Resultado de creación</text>
<path d="M570 970 L340 970" class="ret"/>
<text x="455.0" y="962" class="txt" text-anchor="middle">14. HTTP 201 · Confirmar registro</text>
<rect x="110" y="995" width="1280" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c"/>
<text x="750" y="1020" text-anchor="middle" style="font:bold 14px Arial;fill:#991b1b">Sesión inválida: 401 · Rol sin permiso: 403 · Datos inválidos: 400 · Celda duplicada: conflicto</text>
</svg>