<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker>
<style>
.title{font:bold 30px Arial;fill:#0f172a} .sub{font:16px Arial;fill:#475569}
.head{fill:#e2e8f0;stroke:#334155;stroke-width:2} .actor{font:bold 16px Arial;fill:#0f172a;text-anchor:middle}
.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}
.msg{stroke:#334155;stroke-width:2.1;fill:none;marker-end:url(#a)} .ret{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#r)}
.txt{font:14px Arial;fill:#0f172a} .note{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}
.frame{fill:#f8fafc;stroke:#64748b;stroke-width:1.6} .framehead{font:bold 15px Arial;fill:#334155}
</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="50" y="55" class="title">SD-05 · Inactivar usuario e invalidar sesión activa</text>
<text x="50" y="84" class="sub">La cuenta inactiva pierde el acceso incluso si conserva una cookie de una sesión anterior</text>

<rect x="35.0" y="120" width="150" height="55" rx="8" class="head"/>
<text x="110" y="153" class="actor">Administrador</text>
<line x1="110" y1="175" x2="110" y2="1130" class="life"/>
<rect x="250.0" y="120" width="160" height="55" rx="8" class="head"/>
<text x="330" y="153" class="actor">Interfaz web</text>
<line x1="330" y1="175" x2="330" y2="1130" class="life"/>
<rect x="470.0" y="120" width="160" height="55" rx="8" class="head"/>
<text x="550" y="153" class="actor">API Express</text>
<line x1="550" y1="175" x2="550" y2="1130" class="life"/>
<rect x="690.0" y="120" width="160" height="55" rx="8" class="head"/>
<text x="770" y="153" class="actor">Autenticación</text>
<line x1="770" y1="175" x2="770" y2="1130" class="life"/>
<rect x="930.0" y="120" width="160" height="55" rx="8" class="head"/>
<text x="1010" y="153" class="actor">Gestión usuarios</text>
<line x1="1010" y1="175" x2="1010" y2="1130" class="life"/>
<rect x="1200.0" y="120" width="160" height="55" rx="8" class="head"/>
<text x="1280" y="153" class="actor">Repositorio</text>
<line x1="1280" y1="175" x2="1280" y2="1130" class="life"/>
<rect x="1415.0" y="120" width="150" height="55" rx="8" class="head"/>
<text x="1490" y="153" class="actor">PostgreSQL</text>
<line x1="1490" y1="175" x2="1490" y2="1130" class="life"/>
<path d="M110 220 L330 220" class="msg"/>
<text x="220.0" y="212" class="txt" text-anchor="middle">1. Selecciona usuario y confirma inactivación</text>
<path d="M330 275 L550 275" class="msg"/>
<text x="440.0" y="267" class="txt" text-anchor="middle">2. PATCH /api/usuarios/:id/estado</text>
<path d="M550 330 L770 330" class="msg"/>
<text x="660.0" y="322" class="txt" text-anchor="middle">3. Validar cookie, token y sesión</text>
<path d="M770 385 L1490 385" class="msg"/>
<text x="1130.0" y="377" class="txt" text-anchor="middle">4. Consultar estado y rol del administrador</text>
<path d="M1490 440 L770 440" class="ret"/>
<text x="1130.0" y="432" class="txt" text-anchor="middle">5. Administrador activo</text>
<path d="M770 495 L550 495" class="ret"/>
<text x="660.0" y="487" class="txt" text-anchor="middle">6. Autorización concedida</text>
<path d="M550 550 L1010 550" class="msg"/>
<text x="780.0" y="542" class="txt" text-anchor="middle">7. cambiarEstadoUsuario(id, Inactivo)</text>
<path d="M1010 605 L1280 605" class="msg"/>
<text x="1145.0" y="597" class="txt" text-anchor="middle">8. Validar reglas de negocio</text>
<path d="M1280 660 L1490 660" class="msg"/>
<text x="1385.0" y="652" class="txt" text-anchor="middle">9. UPDATE Usuario SET estado = Inactivo</text>
<path d="M1490 705 L1280 705" class="ret"/>
<text x="1385.0" y="697" class="txt" text-anchor="middle">10. Estado actualizado</text>
<path d="M1280 750 L1010 750" class="ret"/>
<text x="1145.0" y="742" class="txt" text-anchor="middle">11. Confirmación</text>
<path d="M1010 795 L550 795" class="ret"/>
<text x="780.0" y="787" class="txt" text-anchor="middle">12. Operación exitosa</text>
<path d="M550 840 L330 840" class="ret"/>
<text x="440.0" y="832" class="txt" text-anchor="middle">13. HTTP 200 · Usuario inactivado</text>
<rect x="65" y="875" width="1470" height="235" rx="12" class="frame"/>
<rect x="65" y="875" width="1470" height="36" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="85" y="899" class="framehead">Flujo posterior · La persona intenta reutilizar la sesión que tenía abierta</text>
<path d="M110 950 L330 950" class="msg"/>
<text x="220.0" y="942" class="txt" text-anchor="middle">14. Intenta abrir un módulo protegido</text>
<path d="M330 995 L550 995" class="msg"/>
<text x="440.0" y="987" class="txt" text-anchor="middle">15. Solicitud con cookie anterior</text>
<path d="M550 1040 L770 1040" class="msg"/>
<text x="660.0" y="1032" class="txt" text-anchor="middle">16. Validar sesión y consultar estado actual</text>
<path d="M770 1080 L1490 1080" class="msg"/>
<text x="1130.0" y="1072" class="txt" text-anchor="middle">17. SELECT estado por id_usuario</text>
<rect x="100" y="1120" width="1400" height="45" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="800" y="1148" text-anchor="middle" style="font:bold 16px Arial;fill:#991b1b">18. Si el estado es Inactivo: eliminar sesión · expirar cookie · responder HTTP 401 CUENTA_INACTIVA</text>
</svg>