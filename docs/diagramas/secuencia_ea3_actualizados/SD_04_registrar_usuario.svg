<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <style>
    .title{font: bold 30px Arial; fill:#0f172a}
    .sub{font: 16px Arial; fill:#475569}
    .head{fill:#e2e8f0;stroke:#334155;stroke-width:2}
    .actor{font:bold 17px Arial;fill:#0f172a;text-anchor:middle}
    .life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}
    .msg{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .ret{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#dasharrow)}
    .txt{font:15px Arial;fill:#0f172a}
    .small{font:13px Arial;fill:#334155}
    .frame{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}
    .framehead{font:bold 15px Arial;fill:#334155}
    .note{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="55" y="58" class="title">SD-04 · Registrar usuario</text>
<text x="55" y="88" class="sub">Flujo administrativo con autenticación, autorización y validaciones</text>

<rect x="35.0" y="125" width="150" height="58" rx="9" class="head"/>
<text x="110" y="160" class="actor">Administrador</text>
<line x1="110" y1="183" x2="110" y2="1050" class="life"/>
<rect x="250.0" y="125" width="160" height="58" rx="9" class="head"/>
<text x="330" y="160" class="actor">Interfaz web</text>
<line x1="330" y1="183" x2="330" y2="1050" class="life"/>
<rect x="470.0" y="125" width="160" height="58" rx="9" class="head"/>
<text x="550" y="160" class="actor">API Express</text>
<line x1="550" y1="183" x2="550" y2="1050" class="life"/>
<rect x="690.0" y="125" width="160" height="58" rx="9" class="head"/>
<text x="770" y="160" class="actor">Autenticación</text>
<line x1="770" y1="183" x2="770" y2="1050" class="life"/>
<rect x="930.0" y="125" width="160" height="58" rx="9" class="head"/>
<text x="1010" y="160" class="actor">Gestión usuarios</text>
<line x1="1010" y1="183" x2="1010" y2="1050" class="life"/>
<rect x="1200.0" y="125" width="160" height="58" rx="9" class="head"/>
<text x="1280" y="160" class="actor">Repositorio</text>
<line x1="1280" y1="183" x2="1280" y2="1050" class="life"/>
<rect x="1415.0" y="125" width="150" height="58" rx="9" class="head"/>
<text x="1490" y="160" class="actor">PostgreSQL</text>
<line x1="1490" y1="183" x2="1490" y2="1050" class="life"/>
<path d="M110 235 L330 235" class="msg"/>
<text x="220.0" y="225" class="txt" text-anchor="middle">1. Completa y envía el formulario</text>
<path d="M330 290 L550 290" class="msg"/>
<text x="440.0" y="280" class="txt" text-anchor="middle">2. POST /api/usuarios + cookie</text>
<path d="M550 345 L770 345" class="msg"/>
<text x="660.0" y="335" class="txt" text-anchor="middle">3. Validar sesión y token</text>
<path d="M770 400 L1490 400" class="msg"/>
<text x="1130.0" y="390" class="txt" text-anchor="middle">4. Consultar usuario, estado y rol</text>
<path d="M1490 455 L770 455" class="ret"/>
<text x="1130.0" y="445" class="txt" text-anchor="middle">5. Cuenta activa / rol Administrador</text>
<path d="M770 510 L550 510" class="ret"/>
<text x="660.0" y="500" class="txt" text-anchor="middle">6. Autorización concedida</text>
<rect x="535" y="535" width="270" height="56" rx="8" class="note"/>
<text x="670" y="558" text-anchor="middle" class="small">Si sesión inválida: HTTP 401</text><text x="670" y="577" text-anchor="middle" class="small">Si rol incorrecto: HTTP 403</text>
<path d="M550 640 L1010 640" class="msg"/>
<text x="780.0" y="630" class="txt" text-anchor="middle">7. registrarUsuario(datos)</text>
<path d="M1010 695 L1010 695" class="msg"/>
<text x="1010.0" y="685" class="txt" text-anchor="middle">8. Validar campos y reglas</text>
<path d="M1010 750 L1280 750" class="msg"/>
<text x="1145.0" y="740" class="txt" text-anchor="middle">9. buscarPorDocumento(documento)</text>
<path d="M1280 805 L1490 805" class="msg"/>
<text x="1385.0" y="795" class="txt" text-anchor="middle">10. SELECT por documento</text>
<path d="M1490 860 L1280 860" class="ret"/>
<text x="1385.0" y="850" class="txt" text-anchor="middle">11. Resultado de consulta</text>
<rect x="990" y="885" width="500" height="130" rx="8" class="frame"/>
<rect x="990" y="885" width="500" height="34" rx="8" fill="#e2e8f0" stroke="#64748b"/>
<text x="1008" y="908" class="framehead">alt · Resultado de validaciones y documento</text>
<path d="M1010 950 L1280 950" class="msg"/>
<text x="1145.0" y="940" class="txt" text-anchor="middle">12. INSERT Usuario (estado Activo)</text>
<path d="M1280 985 L1490 985" class="msg"/>
<text x="1385.0" y="975" class="txt" text-anchor="middle">13. Guardar usuario</text>
<path d="M1490 1020 L1280 1020" class="ret"/>
<text x="1385.0" y="1010" class="txt" text-anchor="middle">14. Usuario creado</text>
<path d="M1280 1060 L1010 1060" class="ret"/>
<text x="1145.0" y="1050" class="txt" text-anchor="middle">15. Usuario registrado</text>
<rect x="300" y="1072" width="850" height="34" rx="7" fill="#dcfce7" stroke="#15803d"/>
<text x="725" y="1095" text-anchor="middle" style="font:bold 15px Arial;fill:#166534">16. API responde 201 Created · Interfaz confirma el registro</text>
</svg>